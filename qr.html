<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silviu's Gift — QR Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #e4ae39;
      --bg:   #0e1521;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%,
        rgba(228,174,57,0.09) 0%, transparent 65%);
      pointer-events: none;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 0 60px rgba(228,174,57,0.25), 0 0 0 1px rgba(228,174,57,0.15);
      position: relative;
    }

    /* gold corner accents */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-color: var(--gold);
      border-style: solid;
    }
    .card::before { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
    .card::after  { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

    .card-top {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #888;
    }

    #qr-canvas {
      display: block;
      border-radius: 4px;
    }

    .card-name {
      font-size: 26px;
      font-weight: 700;
      color: #111;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.2;
    }
    .card-name span { color: var(--gold); }

    .card-hint {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaa;
    }

    .btn-print {
      padding: 12px 40px;
      background: linear-gradient(135deg, #e4ae39 0%, #c8902a 100%);
      color: #0a0e16;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      transition: filter 0.2s, transform 0.15s;
      position: relative;
    }
    .btn-print:hover  { filter: brightness(1.12); transform: scale(1.04); }
    .btn-print:active { transform: scale(0.97); }

    .url-hint {
      font-size: 11px;
      color: #4a6070;
      letter-spacing: 1px;
      text-align: center;
    }

    /* ── Print styles ── */
    @media print {
      body {
        background: #fff;
        min-height: unset;
      }
      body::before { display: none; }
      .btn-print   { display: none; }
      .url-hint    { color: #999; }
      .card {
        box-shadow: none;
        border: 1px solid #ddd;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-top">&#9733; Birthday Gift &#9733;</div>
    <canvas id="qr-canvas"></canvas>
    <div class="card-name">Happy Birthday<br><span>Silviu</span></div>
    <div class="card-hint">Scan to open your gift</div>
  </div>

  <button class="btn-print" onclick="window.print()">Print QR Code</button>
  <div class="url-hint">robertdima96.github.io/silviu-bday</div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    QRCode.toCanvas(
      document.getElementById('qr-canvas'),
      'https://robertdima96.github.io/silviu-bday/',
      {
        width: 260,
        margin: 2,
        color: { dark: '#0e1521', light: '#ffffff' }
      }
    );
  </script>
</body>
</html>
