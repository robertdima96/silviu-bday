<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1521">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Happy Birthday Silviu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold:   #e4ae39;
      --gold2:  rgba(228,174,57,0.35);
      --bg:     #0e1521;
      --bg2:    #141f2e;
      --border: #1e3045;
      --blue:   #4b69ff;
      --purple: #8847ff;
      --pink:   #d32ee6;
      --red:    #eb4b4b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      color: #c6d4df;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 90% 55% at 50% 0%,
        rgba(228,174,57,0.08) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* ══════════════════════════════════════
       SCREENS
    ══════════════════════════════════════ */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(28px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ══════════════════════════════════════
       INTRO
    ══════════════════════════════════════ */
    #s-intro { gap: 20px; }

    .intro-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.7;
    }

    .intro-gift {
      font-size: 62px;
      line-height: 1;
      animation: floatY 3.2s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .intro-title {
      font-size: clamp(32px, 8vw, 58px);
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .intro-title span { color: var(--gold); }

    .intro-sub {
      font-size: clamp(14px, 3.5vw, 16px);
      font-weight: 500;
      color: #5a7080;
      max-width: 300px;
      line-height: 1.7;
    }

    .btn-open {
      margin-top: 6px;
      padding: 14px 52px;
      background: linear-gradient(135deg, #e4ae39 0%, #c8902a 100%);
      color: #0a0e16;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
      transition: filter 0.2s, transform 0.15s;
    }
    .btn-open:hover  { filter: brightness(1.15); transform: scale(1.04); }
    .btn-open:active { transform: scale(0.97); }

    /* ══════════════════════════════════════
       OPENING
    ══════════════════════════════════════ */
    #s-opening { gap: 0; }

    .open-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #364b5c;
      margin-bottom: 24px;
    }

    .strip-wrap { width: 100%; position: relative; }

    .tick { color: var(--gold); font-size: 13px; text-align: center; line-height: 1; }
    .tick.top    { margin-bottom: 3px; }
    .tick.bottom { margin-top: 3px; }

    .strip-box {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: var(--bg2);
      border-top: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
      touch-action: none;
    }

    /* center line */
    .strip-box::after {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 2px;
      transform: translateX(-50%);
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold), 0 0 28px var(--gold2);
      z-index: 5;
      pointer-events: none;
    }

    /* edge fades — tighter on mobile */
    .strip-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, var(--bg2) 0%, transparent 10%),
        linear-gradient(to left,  var(--bg2) 0%, transparent 10%);
      z-index: 4;
      pointer-events: none;
    }

    .strip {
      display: flex;
      align-items: center;
      padding: 14px 0;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── cards ── */
    .card {
      flex-shrink: 0;
      width: 110px;
      height: 136px;
      margin: 0 5px;
      border-radius: 3px;
      border-bottom: 3px solid transparent;
      background: #0c1825;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.1s;
    }
    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 35%;
      background: linear-gradient(to top, rgba(255,255,255,0.03), transparent);
      pointer-events: none;
    }

    .card.r-blue   { border-color: var(--blue);   background: #0c1228; }
    .card.r-purple { border-color: var(--purple);  background: #0e0c28; }
    .card.r-pink   { border-color: var(--pink);    background: #160c28; }
    .card.r-red    { border-color: var(--red);     background: #1a0c0c; }
    .card.r-gold   { border-color: var(--gold);    background: #120f04; }

    .card.at-center { box-shadow: 0 0 16px rgba(255,255,255,0.12) inset; }
    .card.r-gold.at-center { box-shadow: 0 0 24px rgba(228,174,57,0.4) inset; }

    .card img {
      width: 100px;
      height: 82px;
      object-fit: contain;
      object-position: center;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    .card-type {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }
    .r-blue   .card-type { color: var(--blue);   }
    .r-purple .card-type { color: var(--purple);  }
    .r-pink   .card-type { color: var(--pink);    }
    .r-red    .card-type { color: var(--red);     }
    .r-gold   .card-type { color: var(--gold);    }

    .card-name {
      font-size: 9px;
      font-weight: 600;
      line-height: 1.4;
      padding: 0 6px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .r-blue   .card-name { color: #8099ff; }
    .r-purple .card-name { color: #b080ff; }
    .r-pink   .card-name { color: #e070f0; }
    .r-red    .card-name { color: #ff8080; }
    .r-gold   .card-name { color: var(--gold); }

    /* ══════════════════════════════════════
       RESULT
    ══════════════════════════════════════ */
    #s-result {
      gap: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .res-glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 70% at 50% 50%,
        rgba(228,174,57,0.14) 0%, transparent 70%);
      pointer-events: none;
      animation: glowPulse 2.5s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; }
    }

    .res-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold);
      position: relative;
      z-index: 1;
    }

    .res-img { position: relative; z-index: 1; }
    .res-img img {
      width: min(320px, 72vw);
      filter:
        drop-shadow(0 0 24px rgba(228,174,57,0.6))
        drop-shadow(0 0 60px rgba(228,174,57,0.25));
      animation: knifeFloat 4s ease-in-out infinite;
    }
    @keyframes knifeFloat {
      0%, 100% { transform: translateY(0)    rotate(-5deg); }
      50%       { transform: translateY(-16px) rotate(-2deg); }
    }

    .res-name {
      font-size: clamp(24px, 6vw, 44px);
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }
    .res-name em { font-style: normal; color: var(--gold); }

    .res-meta {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #364b5c;
      position: relative;
      z-index: 1;
    }

    .res-line {
      width: 56px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      position: relative;
      z-index: 1;
    }

    .res-msg {
      font-size: clamp(15px, 3.5vw, 20px);
      font-weight: 500;
      color: #6a8090;
      line-height: 1.7;
      max-width: 380px;
      position: relative;
      z-index: 1;
    }
    .res-msg strong { color: #ddeeff; font-weight: 700; }

    /* short screens */
    @media (max-height: 680px) {
      #s-result { gap: 10px; }
      .res-img img { width: min(220px, 58vw); }
      .intro-gift { font-size: 48px; }
      #s-intro { gap: 14px; }
    }
    @media (max-height: 560px) {
      #s-result { gap: 6px; }
      .res-img img { width: min(160px, 45vw); }
      .res-eyebrow { display: none; }
    }

    /* ══════════════════════════════════════
       VOLUME CONTROL
    ══════════════════════════════════════ */
    .vol-ctrl {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      right: max(18px, env(safe-area-inset-right));
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(10, 16, 26, 0.88);
      border: 1px solid #1e3045;
      border-radius: 24px;
      padding: 8px 14px 8px 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .vol-icon {
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      line-height: 1;
    }

    .vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 72px;
      height: 3px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(to right, var(--gold) 45%, #1e3045 45%);
    }
    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(228,174,57,0.5);
    }
    .vol-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 6px rgba(228,174,57,0.5);
    }

    /* ══════════════════════════════════════
       CONFETTI
    ══════════════════════════════════════ */
    .confetti-el {
      position: fixed;
      top: -14px;
      border-radius: 2px;
      z-index: 200;
      animation: cfall linear forwards;
    }
    @keyframes cfall {
      to { transform: translateY(110vh) rotate(900deg); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- ══════════ VOLUME ══════════ -->
<div class="vol-ctrl">
  <span class="vol-icon" id="vol-icon">&#128266;</span>
  <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="0.45">
</div>

<!-- ══════════ INTRO ══════════ -->
<div id="s-intro" class="screen active">
  <div class="intro-badge">Birthday Special &nbsp;&#9733;</div>
  <div class="intro-gift">&#127873;</div>
  <h1 class="intro-title">Happy Birthday<br><span>Silviu</span></h1>
  <p class="intro-sub">You have a gift waiting inside.<br>Open the case to reveal it.</p>
  <button class="btn-open" id="btn-open">Open Case</button>
</div>

<!-- ══════════ OPENING ══════════ -->
<div id="s-opening" class="screen">
  <p class="open-label">Opening Birthday Case</p>
  <div class="strip-wrap">
    <div class="tick top">&#9660;</div>
    <div class="strip-box">
      <div class="strip" id="strip"></div>
    </div>
    <div class="tick bottom">&#9650;</div>
  </div>
</div>

<!-- ══════════ RESULT ══════════ -->
<div id="s-result" class="screen">
  <div class="res-glow"></div>
  <div class="res-eyebrow">&#9733; Extraordinary Special Item</div>
  <div class="res-img">
    <img id="res-knife-img" src="" alt="Bayonet | Lore">
  </div>
  <div class="res-name">Bayonet <em>| Lore</em></div>
  <div class="res-meta">Field-Tested &nbsp;&#183;&nbsp; Pattern #449 &nbsp;&#183;&nbsp; 0.2256</div>
  <div class="res-line"></div>
  <p class="res-msg">Happy Birthday <strong>Silviu</strong> &#127874;<br>This one&rsquo;s real &mdash; and it&rsquo;s all yours.</p>
</div>

<script>
  /* ═══════════════════════════════════════
     CONSTANTS
  ═══════════════════════════════════════ */
  const ITEM_W     = 120;
  const WINNER_IDX = 82;
  const TOTAL      = 94;
  const DURATION   = 12000;

  const CDN = 'https://community.akamai.steamstatic.com/economy/image/';
  const SND = 'https://raw.githubusercontent.com/sourcesounds/csgo/master/sound/ui/';

  // Per-model Steam CDN images
  const IMG = {
    gut:       CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1c-uaRe6tSLvmUBnOvzOtyufRkAX2yxBsh4muAw9isIy6QZwQgCJAmQOECtRbqxtzhNeu37wzcjN5CzC7gznQesV00pN0/128fx128f',
    falchion:  CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1d7v6tYK1iLs-AAVieyOl-pN5kSi26gBBp4WjTnov8cCiUbQR0DZB0QLYDsUPuld2zPuu25AbfjYtMyCv4hngYvTErvbiHSFn7Vw/128fx128f',
    shadow:    CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1L-uGmV7d9H-SSHmKv1Px0se9WQiy3nAgq_T6Ey4ureHKTbVQoCsF1QOEMtxawm4DjM-vm5VHX39oQmH_72ywd7yl1o7FVpYMXOAk/128fx128f',
    navaja:    CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1c9uK9cZtnIfOYBWmZx-tJsfBWTSWmkBkYvjiBk5r0b3uRagclDsR1FudYtRa-xtzgN-7m41SIjt9GxCr22C1KvXk55OgAVKo7uvqAow4lkm4/128fx128f',
    flip:      CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1d4_u-V6V8H_KfG2KU_uNztOh8QmfixkUl5G_cno2seHORbwdyD5dwE-AIsUaxk4DkM7vl4g2LiIgXxSz7kGoXualjL24Z/128fx128f',
    bowie:     CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1I-uC4YbJsLM-RAXCZxNFloN59Tjm2qgg1sTyLpYL8JSLSMxgjDpNyR-IL40a_w9CxP-vmswPX2thFnn34j3tA5iw96rwBBfd2_qzSkUifZk-7LbaA/128fx128f',
    stiletto:  CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1I-_uibbB5L8-SA1iKxOxksd5kSi26gBBp52mAm9v6dymXaFUhCsAiRuBbsRLtx9bmMr7m5wbeidkXzy3-hipBvzErvbiDbQpI5w/128fx128f',
    talon:     CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1M5vahf6lsK_WBMXSA_vp3oORWWjuxlBMYvjiBk5r0b3zEaFIpAsB1FuZcuhC5mtbuY-Pn5g2IitlNmS73jS8a7CppsroAVfU7uvqAQJSSnz8/128fx128f',
    m9:        CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1Wts2sab1iLvWHMXSf_uB_t-l9cCS2kRQyvnPdnI2tInzCZ1IpDJtxRrFbsBHrk9TnYu_rsgzbiN9ByC__jysd5ys5_a9cBsxSNI2Q/128fx128f',
    karambit:  CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1Q7uCvZaZkNM-SH1ifyOJztN5kSi26gBBptWrdmImpInORP1UpA5NxE-EPuhe9x4blPum37wbbjtoQyin6jipO7jErvbhI-bzi8g/128fx128f',
    butterfly: CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyL6kJ_m-B1Z-ua6bbZrLOmsHWivz-dxuPVWQiy3nAgq_WrQzdetd3mePQZ2CpQiQLEOsxO9lIfgYevqtgWKjN0XxCr72ChB6S51o7FVuzX4jsE/128fx128f',
    bayonet:   CDN + 'i0CoZ81Ui0m-9KwlBY1L_18myuGuq1wfhWSaZgMttyVfPaERSR0Wqmu7LAocGIGz3UqlXOLrxM-vMGmW8VNxu5Dx60noTyLzn4_v8ydP0PG7V6ZsOf-dC3OvzeFktd5kSi26gBBp5D-AzNaqIHLBa1MpWcMjR-AI4EOxkt2xYuvk5Q2L2tkTnHqt3SlK5zErvbhU-sE7AQ/360fx360f',
  };

  document.getElementById('res-knife-img').src = IMG.bayonet;

  /* ═══════════════════════════════════════
     AUDIO — master gain + overlap fix
  ═══════════════════════════════════════ */
  const audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
  const masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.45;
  masterGain.connect(audioCtx.destination);

  const buffers = {};
  let   activeTick = null; // prevent tick overlap

  async function loadSound(key, url) {
    try {
      const res = await fetch(url);
      const ab  = await res.arrayBuffer();
      // Promise-wrap for iOS Safari callback compat
      buffers[key] = await new Promise((res, rej) =>
        audioCtx.decodeAudioData(ab, res, rej)
      );
    } catch (_) {}
  }

  function playSound(key, vol = 1, delay = 0) {
    const buf = buffers[key];
    if (!buf) return;
    const src  = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    gain.gain.value = vol;
    src.buffer = buf;
    src.connect(gain);
    gain.connect(masterGain);
    src.start(audioCtx.currentTime + delay);
  }

  // Tick: stop the previous one first — eliminates overlap at slow speed
  function playTick(vol) {
    if (activeTick) {
      try { activeTick.stop(0); } catch (_) {}
      activeTick = null;
    }
    const buf = buffers.tick;
    if (!buf) return;
    const src  = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    gain.gain.value = vol;
    src.buffer = buf;
    src.connect(gain);
    gain.connect(masterGain);
    src.start(0);
    activeTick = src;
    src.onended = () => { if (activeTick === src) activeTick = null; };
  }

  loadSound('open',   SND + 'csgo_ui_crate_open.wav');
  loadSound('tick',   SND + 'csgo_ui_crate_item_scroll.wav');
  loadSound('reveal', SND + 'item_reveal6_ancient.wav');

  /* ═══════════════════════════════════════
     VOLUME SLIDER
  ═══════════════════════════════════════ */
  const volSlider = document.getElementById('vol-slider');
  const volIcon   = document.getElementById('vol-icon');
  let   prevVol   = 0.45;

  function updateSlider(v) {
    volSlider.style.background =
      `linear-gradient(to right, var(--gold) ${v * 100}%, #1e3045 ${v * 100}%)`;
    volIcon.textContent = v === 0 ? '\uD83D\uDD07' : v < 0.5 ? '\uD83D\uDD09' : '\uD83D\uDD0A';
  }

  volSlider.addEventListener('input', () => {
    const v = parseFloat(volSlider.value);
    masterGain.gain.value = v;
    if (v > 0) prevVol = v;
    updateSlider(v);
  });

  volIcon.addEventListener('click', () => {
    if (masterGain.gain.value > 0) {
      prevVol = masterGain.gain.value;
      masterGain.gain.value = 0;
      volSlider.value = 0;
    } else {
      masterGain.gain.value = prevVol;
      volSlider.value = prevVol;
    }
    updateSlider(masterGain.gain.value);
  });

  updateSlider(0.45);

  /* ═══════════════════════════════════════
     ITEM POOL
  ═══════════════════════════════════════ */
  const RARITY_LABEL = {
    blue: 'Mil-Spec', purple: 'Restricted',
    pink: 'Classified', red: 'Covert', gold: 'Extraordinary',
  };

  const POOL = [
    { name: 'Gut Knife\nUrban Masked',      r: 'blue',   m: 'gut'       },
    { name: 'Falchion\nNight',              r: 'blue',   m: 'falchion'  },
    { name: 'Shadow Daggers\nUrban Masked', r: 'blue',   m: 'shadow'    },
    { name: 'Navaja\nNight',                r: 'blue',   m: 'navaja'    },
    { name: 'Flip Knife\nForest DDPAT',     r: 'blue',   m: 'flip'      },
    { name: 'Bowie Knife\nUrban Masked',    r: 'blue',   m: 'bowie'     },
    { name: 'Stiletto\nNight',              r: 'blue',   m: 'stiletto'  },
    { name: 'Talon Knife\nUrban Masked',    r: 'blue',   m: 'talon'     },
    { name: 'Gut Knife\nBlue Steel',        r: 'purple', m: 'gut'       },
    { name: 'Falchion\nBlue Steel',         r: 'purple', m: 'falchion'  },
    { name: 'Navaja\nUrbanized',            r: 'purple', m: 'navaja'    },
    { name: 'Flip Knife\nCase Hardened',    r: 'purple', m: 'flip'      },
    { name: 'Stiletto\nBlue Steel',         r: 'purple', m: 'stiletto'  },
    { name: 'Bowie Knife\nCase Hardened',   r: 'purple', m: 'bowie'     },
    { name: 'Gut Knife\nSlaughter',         r: 'pink',   m: 'gut'       },
    { name: 'Falchion\nSlaughter',          r: 'pink',   m: 'falchion'  },
    { name: 'Navaja\nSlaughter',            r: 'pink',   m: 'navaja'    },
    { name: 'Flip Knife\nMamba',            r: 'pink',   m: 'flip'      },
    { name: 'Bowie Knife\nSlaughter',       r: 'pink',   m: 'bowie'     },
    { name: 'M9 Bayonet\nDoppler',          r: 'red',    m: 'm9'        },
    { name: 'Karambit\nCase Hardened',      r: 'red',    m: 'karambit'  },
    { name: 'Butterfly Knife\nFade',        r: 'red',    m: 'butterfly' },
    { name: 'Falchion\nFade',               r: 'red',    m: 'falchion'  },
    { name: 'Gut Knife\nDoppler',           r: 'red',    m: 'gut'       },
    { name: 'Flip Knife\nFade',             r: 'red',    m: 'flip'      },
    { name: 'Talon Knife\nDoppler',         r: 'red',    m: 'talon'     },
  ];

  /* ═══════════════════════════════════════
     BUILD STRIP
  ═══════════════════════════════════════ */
  function buildStrip() {
    const strip = document.getElementById('strip');
    strip.innerHTML = '';

    for (let i = 0; i < TOTAL; i++) {
      const el = document.createElement('div');
      el.className = 'card';

      if (i === WINNER_IDX) {
        el.classList.add('r-gold');
        el.innerHTML = `
          <img src="${IMG.bayonet}" alt="Bayonet | Lore" loading="eager">
          <div class="card-type">${RARITY_LABEL.gold}</div>
          <div class="card-name">&#9733; Bayonet | Lore</div>
        `;
      } else {
        const item = POOL[Math.floor(Math.random() * POOL.length)];
        const [l1, l2] = item.name.split('\n');
        el.classList.add('r-' + item.r);
        el.innerHTML = `
          <img src="${IMG[item.m]}" alt="${l1}" loading="lazy">
          <div class="card-type">${RARITY_LABEL[item.r]}</div>
          <div class="card-name">${l1}<br>${l2}</div>
        `;
      }

      strip.appendChild(el);
    }

    return Array.from(strip.children);
  }

  /* ═══════════════════════════════════════
     SCREEN SWITCH
  ═══════════════════════════════════════ */
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ═══════════════════════════════════════
     ANIMATION  (rAF + expo ease-out)
  ═══════════════════════════════════════ */
  function easeOut(t) {
    return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
  }

  function startAnimation(strip, cards, startX, endX, duration, onTick, onDone) {
    const t0 = performance.now();
    let lastCenterIdx = -1;
    let lastTickTime  = 0;

    function frame(now) {
      const t       = Math.min((now - t0) / duration, 1);
      const eased   = easeOut(t);
      const currentX = startX + (endX - startX) * eased;

      // translate3d forces GPU compositing — smoother on mobile
      strip.style.transform = `translate3d(${currentX}px, 0, 0)`;

      const centerPx    = strip.parentElement.clientWidth / 2;
      const idxAtCenter = Math.floor((centerPx - currentX) / ITEM_W);

      if (idxAtCenter !== lastCenterIdx && idxAtCenter >= 0 && idxAtCenter < TOTAL) {
        if (lastCenterIdx >= 0 && cards[lastCenterIdx])
          cards[lastCenterIdx].classList.remove('at-center');
        lastCenterIdx = idxAtCenter;
        if (cards[idxAtCenter]) cards[idxAtCenter].classList.add('at-center');

        // Throttle: at peak speed skip redundant triggers; near end play every tick
        if (now - lastTickTime >= 30) {
          lastTickTime = now;
          const progress = idxAtCenter / WINNER_IDX;
          const vol = 0.5 + 0.45 * Math.max(0, (progress - 0.6) / 0.4);
          onTick(Math.min(vol, 0.95));
        }
      }

      if (t < 1) requestAnimationFrame(frame);
      else onDone();
    }

    requestAnimationFrame(frame);
  }

  /* ═══════════════════════════════════════
     OPEN CASE
  ═══════════════════════════════════════ */
  document.getElementById('btn-open').addEventListener('click', () => {
    audioCtx.resume();
    playSound('open', 0.7);

    show('s-opening');
    const cards = buildStrip();
    const strip = document.getElementById('strip');

    setTimeout(() => {
      const box       = strip.parentElement;
      const vcenter   = box.clientWidth / 2;
      const winnerMid = WINNER_IDX * ITEM_W + ITEM_W / 2;
      const nudge     = (Math.random() - 0.5) * 44;
      const endX      = vcenter - winnerMid + nudge;

      strip.style.transform = 'translate3d(0, 0, 0)';

      startAnimation(strip, cards, 0, endX, DURATION,
        (vol) => playTick(vol),
        () => {
          // Stop any lingering tick before reveal
          if (activeTick) { try { activeTick.stop(0); } catch (_) {} activeTick = null; }
          setTimeout(() => {
            show('s-result');
            playSound('reveal', 0.9);
            launchConfetti();
          }, 500);
        }
      );
    }, 350);
  });

  /* ═══════════════════════════════════════
     CONFETTI
  ═══════════════════════════════════════ */
  function launchConfetti() {
    const colors = ['#e4ae39','#ff6b6b','#4ecdc4','#f7dc6f','#bb8fce','#74b9ff','#55efc4'];
    for (let i = 0; i < 110; i++) {
      setTimeout(() => {
        const el   = document.createElement('div');
        el.className = 'confetti-el';
        const size = 6 + Math.random() * 9;
        el.style.cssText = [
          `left:${Math.random() * 100}vw`,
          `width:${size}px`,
          `height:${size}px`,
          `background:${colors[Math.floor(Math.random() * colors.length)]}`,
          `border-radius:${Math.random() > 0.45 ? '50%' : '2px'}`,
          `animation-duration:${2.5 + Math.random() * 3}s`,
          `animation-delay:${Math.random() * 0.5}s`,
        ].join(';');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 6500);
      }, i * 25);
    }
  }
</script>
